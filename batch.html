<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>批量下载</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { display: flex; flex-direction: column; height: 100vh; }
      header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
      header img { width: 28px; height: 28px; border-radius: 8px; flex: none; }
      h1 { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
      #pageTitle { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #close { font-size: 18px; line-height: 1; width: 30px; padding: 0; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 16px 10px; }
      .field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 500; }
      .field select, .bar input[type="date"] { height: 30px; }
      #summary { color: var(--muted); font-size: 12px; }

      .list { flex: 1; overflow: auto; margin: 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
      .item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
      .item:last-child { border-bottom: 0; }
      .item:hover { background: var(--sunken); }
      .thumb { position: relative; flex: none; width: 54px; height: 72px; border-radius: 8px; overflow: hidden; background: var(--sunken); }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .thumb span { position: absolute; left: 3px; bottom: 3px; padding: 0 4px; border-radius: 4px; background: rgba(0, 0, 0, 0.62); color: #fff; font-size: 10px; line-height: 16px; font-variant-numeric: tabular-nums; }
      .item .body { flex: 1; min-width: 0; }
      .item .t { font-weight: 550; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
      .item .m { color: var(--muted); font-size: 12px; margin-top: 3px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .item .s { flex: none; max-width: 150px; font-size: 12px; text-align: right; color: var(--muted); }
      .item.done .s { color: var(--ok); font-weight: 600; }
      .item.fail .s { color: var(--err); }
      .item.run .s { color: var(--accent-ink); font-weight: 600; }
      .item .n { flex: none; width: 22px; text-align: right; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
      .empty { padding: 36px 24px; text-align: center; color: var(--muted); }

      footer { padding: 10px 16px 14px; }
      #title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #title:empty { display: none; }
      #status { color: var(--muted); min-height: 20px; }
      #status.ok { color: var(--ok); font-weight: 600; }
      #status.err { color: var(--err); font-weight: 600; }
      .progress { margin: 4px 0 2px; }
      #detail { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
      pre { margin: 6px 0 0; font-size: 12px; max-height: 70px; overflow: auto; color: var(--muted); white-space: pre-wrap; }
      .actions { display: flex; gap: 8px; margin-top: 8px; }
      .actions .btn { height: 40px; font-size: 14px; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon128.png" alt="" />
      <div class="grow">
        <h1>批量下载</h1>
        <div id="pageTitle"></div>
      </div>
      <button class="btn ghost" id="close" hidden title="关闭">×</button>
    </header>
    <div class="bar">
      <label class="field">清晰度
        <select id="quality">
          <option value="max">最高</option>
          <option value="1080">1080P</option>
          <option value="720">720P</option>
          <option value="480">480P</option>
          <option value="min">最低（文件最小）</option>
        </select>
      </label>
      <label class="field">下载内容
        <select id="content">
          <option value="media">视频 / 图片</option>
          <option value="both">视频 / 图片 + 封面</option>
          <option value="cover">只要封面</option>
        </select>
      </label>
      <label class="check" id="ownerWrap" hidden><input type="checkbox" id="ownerOnly" checked />只看这个博主</label>
    </div>
    <div class="bar" id="dateWrap" hidden>
      <label class="field">发布日期 <input type="date" id="dateFrom" /></label>
      <span class="field">到</span>
      <input type="date" id="dateTo" />
      <button class="btn sm ghost" id="dateClear">清除</button>
    </div>
    <div class="bar">
      <label class="check"><input type="checkbox" id="all" checked />全选</label>
      <span id="summary" class="grow">正在读取本页已加载的作品…</span>
      <button class="btn sm" id="auto">自动往下翻页</button>
      <button class="btn sm" id="refresh">刷新</button>
      <button class="btn sm" id="csv">导出数据表</button>
    </div>
    <div class="list">
      <div id="rows"></div>
      <div class="empty" id="empty" hidden>还没有读到作品。在原页面往下滚动加载更多作品，再点“刷新”；或者点“自动往下翻页”。</div>
    </div>
    <footer>
      <div id="title"></div>
      <div id="status"></div>
      <div class="progress"><div id="bar"></div></div>
      <div id="detail"></div>
      <pre id="log" hidden></pre>
      <div class="actions">
        <button class="btn primary grow" id="start">下载勾选的作品</button>
        <button class="btn grow" id="stop" hidden>停止</button>
      </div>
    </footer>
    <script src="lib/ffmpeg/ffmpeg.js"></script>
    <script src="job.js"></script>
    <script src="providers.js"></script>
    <script src="batch.js"></script>
  </body>
</html>
